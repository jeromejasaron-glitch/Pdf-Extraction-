<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b1d">
<link rel="manifest" href="manifest.webmanifest">
<title>Encre</title>
<style>
:root{--bg:#0c0b1d;--ink:#6d5efc;--aqua:#3de0d0;--rose:#ff6f91;--txt:#f4f2ff;--mut:#a29fc8;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
.bg{position:fixed;inset:0;overflow:hidden;z-index:-1}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--ink);left:-20vmax;top:-20vmax}
.bg i:nth-child(2){background:var(--aqua);right:-30vmax;top:20vh;opacity:.28;animation-delay:-6s}
.bg i:nth-child(3){background:var(--rose);left:10vw;bottom:-35vmax;opacity:.3;animation-delay:-12s}
@keyframes drift{to{transform:translate3d(8vmax,5vmax,0) scale(1.15)}}
.shell{min-height:100%;max-width:1280px;margin:auto;padding:20px 16px 28px;display:grid;gap:16px;align-content:start}
header{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font:italic 600 2rem/1 ui-serif,"Iowan Old Style",Georgia,serif;letter-spacing:-.02em;background:linear-gradient(100deg,#fff,var(--aqua) 55%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:18px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:grid;gap:14px;align-content:start}
.drop{border:1.5px dashed var(--line);border-radius:22px;padding:28px 16px;text-align:center;cursor:pointer;transition:transform .5s var(--spring),border-color .3s,background .3s}
.drop:hover,.drop.on{transform:scale(1.02);border-color:var(--aqua);background:rgba(61,224,208,.07)}
.drop:active{transform:scale(.97)}
.drop b{display:block;font-size:1.05rem}.drop span{color:var(--mut);font-size:.9rem}
.drop svg{width:44px;height:44px;margin-bottom:8px;stroke:var(--aqua);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.28);border-radius:16px;padding:4px;position:relative}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:linear-gradient(120deg,var(--ink),#9b6dff);transition:transform .55s var(--spring);transform:translateX(var(--x,0))}
.seg button{position:relative;background:none;border:0;color:var(--txt);font:inherit;padding:11px 6px;cursor:pointer;border-radius:12px}
input[type=text],input[type=password],input[type=search]{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--txt);font:inherit;outline:none;transition:border-color .3s,box-shadow .3s}
input:focus-visible{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(61,224,208,.2)}
button:focus-visible,.drop:focus-visible{outline:2px solid var(--aqua);outline-offset:3px}
small{color:var(--mut);display:block;font-size:.82rem}
.cta{position:relative;overflow:hidden;border:0;border-radius:18px;padding:16px;font:600 1rem system-ui,sans-serif;color:#fff;background:#1d1b3a;cursor:pointer;transition:transform .5s var(--spring),opacity .3s;isolation:isolate}
.cta::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,var(--ink),var(--aqua),var(--rose));transform:scaleX(var(--p,1));transform-origin:left;transition:transform .6s var(--spring)}
.cta:disabled{opacity:.45;cursor:default}
.cta:not(:disabled):active,.btn:active{transform:scale(.95)}
.btn{flex:1;border:1px solid var(--line);background:var(--glass);color:var(--txt);border-radius:16px;padding:14px;font:inherit;cursor:pointer;transition:transform .5s var(--spring),background .3s}
.btn:disabled{opacity:.4}.btn.main{background:linear-gradient(120deg,var(--ink),#9b6dff);border:0}
.row{display:flex;gap:10px}
.pages{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pg{position:relative;border-radius:18px;overflow:hidden;background:#111;border:1px solid var(--line);animation:pop .7s var(--spring) both;contain:layout paint}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.9)}}
.pg img{display:block;width:100%;height:auto}
.ov{position:absolute;inset:0;pointer-events:none}
.ov u{position:absolute;border-radius:4px;background:rgba(255,111,145,.4);box-shadow:0 0 0 2px var(--rose);animation:ping .5s var(--spring)}
@keyframes ping{from{transform:scale(1.6);opacity:0}}
.badge{position:absolute;left:8px;bottom:8px;background:rgba(12,11,29,.75);backdrop-filter:blur(8px);border-radius:10px;padding:3px 9px;font-size:.78rem}
.empty{color:var(--mut);text-align:center;padding:34px 10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,160%);background:#2a1830;border:1px solid var(--rose);border-radius:16px;padding:12px 16px;max-width:92vw;transition:transform .6s var(--spring)}
#toast.on{transform:translate(-50%,0)}
[hidden]{display:none!important}
@media (min-width:900px) and (orientation:landscape){
 .shell{grid-template-columns:380px 1fr;grid-template-rows:auto 1fr;height:100%;padding:28px}
 header{grid-column:1/-1}
 .panel.r{overflow:auto;max-height:calc(100vh - 110px);align-content:start}
 .pages{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<main class="shell">
<header><h1>Encre</h1><small id="st">Prêt</small></header>

<section class="panel l">
 <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choisir un PDF">
  <svg viewBox="0 0 48 48"><path d="M14 6h14l8 8v28H14z"/><path d="M28 6v8h8"/><path d="M19 30c3-6 5 4 8-2s3 2 5-1"/></svg>
  <b id="fname">Choisir un PDF</b><span id="fmeta">ou le déposer ici</span>
 </div>
 <input id="file" type="file" accept="application/pdf,.pdf" hidden>
 <div class="seg" id="seg"><button data-e="local">Sur l’appareil</button><button data-e="cloud">Cloud</button></div>
 <div id="keybox" hidden>
  <input id="key" type="password" placeholder="Clé API Google Cloud Vision" autocomplete="off">
  <small>La clé reste sur cet appareil. En mode Cloud, chaque page est envoyée à Google pour analyse.</small>
 </div>
 <small id="hint">Mode local : gratuit et privé, précision moyenne sur le manuscrit.</small>
 <button class="cta" id="go" disabled>Rendre cherchable</button>
</section>

<section class="panel r">
 <input id="q" type="search" placeholder="Tester la recherche d’un mot…" disabled>
 <div class="pages" id="pages"><div class="empty">Les pages analysées apparaîtront ici.</div></div>
 <div class="row"><button class="btn main" id="share" disabled>Envoyer vers Noteshelf</button><button class="btn" id="dl" disabled>Télécharger</button></div>
</section>
</main>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=s=>document.querySelector(s);
let engine="local",file=null,bytes=null,res=[],out=null,busy=false;
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),4200)}
function prog(p,label){$("#go").style.setProperty("--p",p);if(label)$("#st").textContent=label}

function setEngine(e){
 engine=e;store.set("engine",e);
 $("#seg").style.setProperty("--x",e==="cloud"?"100%":"0");
 $("#keybox").hidden=e!=="cloud";
 $("#hint").textContent=e==="cloud"?"Mode cloud : bien meilleur sur l’écriture manuscrite.":"Mode local : gratuit et privé, précision moyenne sur le manuscrit.";
}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>!busy&&setEngine(b.dataset.e));
$("#key").value=store.get("key")||"";$("#key").oninput=e=>store.set("key",e.target.value.trim());
setEngine(store.get("engine")==="cloud"?"cloud":"local");

function setFile(f){
 file=f;res=[];out=null;
 $("#fname").textContent=f.name;$("#fmeta").textContent=(f.size/1048576).toFixed(1)+" Mo";
 $("#go").disabled=false;prog(1);$("#pages").innerHTML='<div class="empty">Prêt à analyser.</div>';
 ["#share","#dl","#q"].forEach(s=>$(s).disabled=true);
 f.arrayBuffer().then(b=>bytes=new Uint8Array(b));
}
const drop=$("#drop");
drop.onclick=()=>$("#file").click();
drop.onkeydown=e=>(e.key==="Enter"||e.key===" ")&&$("#file").click();
$("#file").onchange=e=>e.target.files[0]&&setFile(e.target.files[0]);
["dragover","dragenter"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add("on")}));
["dragleave","drop"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove("on")}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];f&&/pdf$/i.test(f.type||f.name)&&setFile(f)});

async function local(w,cv){
 const {data}=await w.recognize(cv);
 return data.words.filter(x=>x.confidence>20&&x.text.trim()).map(x=>({t:x.text,x0:x.bbox.x0,y0:x.bbox.y0,x1:x.bbox.x1,y1:x.bbox.y1}));
}
async function cloud(cv){
 const key=store.get("key");if(!key)throw new Error("Ajoute ta clé Google Cloud Vision.");
 const r=await fetch("https://vision.googleapis.com/v1/images:annotate?key="+encodeURIComponent(key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({requests:[{image:{content:cv.toDataURL("image/jpeg",.85).split(",")[1]},features:[{type:"DOCUMENT_TEXT_DETECTION"}],imageContext:{languageHints:["fr"]}}]})});
 const j=await r.json();if(!r.ok||j.responses?.[0]?.error)throw new Error((j.error||j.responses[0].error).message);
 const o=[];
 for(const b of j.responses[0].fullTextAnnotation?.pages?.[0]?.blocks||[])for(const p of b.paragraphs)for(const w of p.words){
  const v=w.boundingBox.vertices,xs=v.map(a=>a.x||0),ys=v.map(a=>a.y||0);
  o.push({t:w.symbols.map(s=>s.text).join(""),x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)});
 }
 return o;
}

async function run(){
 if(busy||!bytes)return;busy=true;res=[];out=null;$("#pages").innerHTML="";
 ["#share","#dl","#q"].forEach(s=>$(s).disabled=true);$("#go").disabled=true;prog(0);
 let w=null;
 try{
  const doc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
  if(engine==="local"){prog(.02,"Chargement du moteur…");w=await Tesseract.createWorker("fra")}
  for(let i=1;i<=doc.numPages;i++){
   prog(.05+.9*(i-1)/doc.numPages,"Page "+i+" sur "+doc.numPages);
   const pg=await doc.getPage(i),v0=pg.getViewport({scale:1}),s=2000/Math.max(v0.width,v0.height),vp=pg.getViewport({scale:s});
   const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
   await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
   const words=engine==="local"?await local(w,cv):await cloud(cv);
   const th=document.createElement("canvas");th.width=480;th.height=Math.round(480*cv.height/cv.width);
   th.getContext("2d").drawImage(cv,0,0,th.width,th.height);
   res.push({w:cv.width,h:cv.height,words,thumb:th.toDataURL("image/jpeg",.7)});
   addCard(res.length-1);
  }
  prog(.97,"Écriture de la couche texte…");await build();
  prog(1,"Terminé");["#share","#dl","#q"].forEach(s=>$(s).disabled=false);
  toast(res.reduce((n,r)=>n+r.words.length,0)+" mots ajoutés au PDF.");
 }catch(e){console.error(e);prog(1,"Erreur");toast("Échec : "+(e.message||e))}
 finally{if(w)await w.terminate();busy=false;$("#go").disabled=false}
}
function addCard(i){
 const r=res[i],d=document.createElement("div");d.className="pg";d.style.animationDelay="40ms";
 d.innerHTML='<img alt="Page '+(i+1)+'" src="'+r.thumb+'"><div class="ov"></div><span class="badge">p. '+(i+1)+" – "+r.words.length+" mots</span>";
 $("#pages").appendChild(d);
}
function search(){
 const q=norm($("#q").value.trim());
 document.querySelectorAll(".pg").forEach((d,i)=>{
  const r=res[i],ov=d.querySelector(".ov");ov.innerHTML="";let n=0;
  if(q)for(const w of r.words)if(norm(w.t).includes(q)){n++;const u=document.createElement("u");
   u.style.cssText="left:"+w.x0/r.w*100+"%;top:"+w.y0/r.h*100+"%;width:"+(w.x1-w.x0)/r.w*100+"%;height:"+(w.y1-w.y0)/r.h*100+"%";ov.appendChild(u)}
  d.querySelector(".badge").textContent="p. "+(i+1)+" – "+(q?n+" trouvé"+(n>1?"s":""):r.words.length+" mots");
 });
}
$("#q").oninput=search;

async function build(){
 const L=PDFLib,pdf=await L.PDFDocument.load(bytes),font=await pdf.embedFont(L.StandardFonts.Helvetica),pgs=pdf.getPages();
 const inv=L.setTextRenderingMode&&L.TextRenderingMode;
 res.forEach((r,i)=>{
  const pg=pgs[i];if(!pg)return;const H=pg.getHeight(),k=pg.getWidth()/r.w;
  if(inv)pg.pushOperators(L.pushGraphicsState(),L.setTextRenderingMode(L.TextRenderingMode.Invisible));
  for(const w of r.words){
   const t=w.t.replace(/[^\u0020-\u00FF’‘“”–—…€œŒ]/g,"");if(!t.trim())continue;
   try{
    const bh=(w.y1-w.y0)*k,fs=Math.max(1,Math.min(((w.x1-w.x0)*k)/font.widthOfTextAtSize(t,1),bh*1.6));
    pg.drawText(t,{x:w.x0*k,y:H-w.y1*k+bh*.2,size:fs,font,...(inv?{}:{opacity:0})});
   }catch{}
  }
  if(inv)pg.pushOperators(L.popGraphicsState());
 });
 out=await pdf.save();
}
const outName=()=>file.name.replace(/\.pdf$/i,"")+"_cherchable.pdf";
$("#dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"application/pdf"}));a.download=outName();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),9e3)};
$("#share").onclick=async()=>{
 const f=new File([out],outName(),{type:"application/pdf"});
 if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]}).catch(()=>{});else $("#dl").click();
};
$("#go").onclick=run;

if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{
 if(!new URLSearchParams(location.search).has("shared"))return;
 try{
  const c=await caches.open("inbox"),u=new URL("inbox",document.baseURI),r=await c.match(u);
  if(r){const b=await r.blob();await c.delete(u);setFile(new File([b],decodeURIComponent(r.headers.get("x-name")||"note.pdf"),{type:"application/pdf"}));await bytesReady();run()}
 }catch(e){console.error(e)}
 history.replaceState(null,"",location.pathname);
})();
function bytesReady(){return new Promise(r=>{const t=setInterval(()=>{if(bytes){clearInterval(t);r()}},30)})}
</script>
</body>
</html>
